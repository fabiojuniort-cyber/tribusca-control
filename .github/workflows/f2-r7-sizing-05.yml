name: F2 R7 sizing 05 manual single-use 45k
# No push, pull_request, ready, synchronize, workflow_call or repository_dispatch.
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Full immutable SHA explicitly passed by COORD
        required: true
        type: string
      review_comment_id:
        description: Comment in control127 with COORD_PASS_R7_SIZING_05 <full SHA> prev_run=42331592401 scope=45k max_attempts=2
        required: true
        type: string
permissions:
  contents: read
  issues: read
  actions: read
  # Proven by probe run 42139345705: issue comments on PR #127 need pull_requests=read (403 without, 200 with).
  pull-requests: read
concurrency:
  group: f2-r7-sizing-05
  cancel-in-progress: false
jobs:
  stage_45000:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      F2_VOLUME: '45000'
      F2_GRANT: F2-R7-SIZING-05
      F2_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      F2_REVIEW_COMMENT_ID: ${{ inputs.review_comment_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reviewed control HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Verify coordinator PASS and single-use grant before backend preparation
        run: node --input-type=module -e "import {authorize} from './docs/investigations/r7-sizing/manual-gate-05.mjs'; await authorize();"
      - name: Verify pinned backend trees via anonymous HTTPS
        run: bash docs/investigations/r7-sizing/checkout-anonymous-03.sh
      - name: One attempt per tree; first anomaly stops stage
        run: node docs/investigations/r7-sizing/run-stage.mjs
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f2-r7-sizing-05-45000
          path: f2-r7-sizing-45000/
          if-no-files-found: ignore
          retention-days: 7
