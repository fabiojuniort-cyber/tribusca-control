name: F2 R7 sizing 02 manual single-use grant (resumes after run 42132149543)
# No push, pull_request, ready, synchronize, workflow_call or repository_dispatch.
on:
  workflow_dispatch:
    inputs:
      reviewed_head:
        description: Full immutable SHA explicitly passed by COORD
        required: true
        type: string
      review_comment_id:
        description: Comment in control127 with COORD_PASS_R7_SIZING_02 <full SHA> prev_run=42132149543
        required: true
        type: string
permissions:
  contents: read
  issues: read
  actions: read
  # Proven by probe run 42139345705: issue comments on PR #127 need pull_requests=read (403 without, 200 with).
  pull-requests: read
concurrency:
  group: f2-r7-sizing-02
  cancel-in-progress: false
jobs:
  stage_6000:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      F2_VOLUME: '6000'
      F2_GRANT: F2-R7-SIZING-02
      F2_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      F2_REVIEW_COMMENT_ID: ${{ inputs.review_comment_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reviewed control HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Verify coordinator PASS and single-use grant before backend preparation
        run: node --input-type=module -e "import {authorize} from './docs/investigations/r7-sizing/manual-gate-02.mjs'; await authorize();"
      - name: Checkout fixed control tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fabiojuniort-cyber/radar-fiscal-backend
          ref: b2150ab5ef34e9f9646e219d522e47738d9c04f5
          path: backend-control
          token: ${{ secrets.OPS_BACKEND_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout fixed integration tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fabiojuniort-cyber/radar-fiscal-backend
          ref: 2c41fbab8169b7efca6bd2e80c963d57a50585b6
          path: backend-integration
          token: ${{ secrets.OPS_BACKEND_READ_TOKEN }}
          persist-credentials: false
      - name: One attempt per tree; first anomaly stops stage
        run: node docs/investigations/r7-sizing/run-stage.mjs
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f2-r7-sizing-02-6000
          path: f2-r7-sizing-6000/
          if-no-files-found: ignore
          retention-days: 7
  stage_18000:
    needs: stage_6000
    if: needs.stage_6000.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      F2_VOLUME: '18000'
      F2_GRANT: F2-R7-SIZING-02
      F2_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      F2_REVIEW_COMMENT_ID: ${{ inputs.review_comment_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reviewed control HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Verify coordinator PASS and single-use grant before backend preparation
        run: node --input-type=module -e "import {authorize} from './docs/investigations/r7-sizing/manual-gate-02.mjs'; await authorize();"
      - name: Checkout fixed control tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fabiojuniort-cyber/radar-fiscal-backend
          ref: b2150ab5ef34e9f9646e219d522e47738d9c04f5
          path: backend-control
          token: ${{ secrets.OPS_BACKEND_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout fixed integration tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fabiojuniort-cyber/radar-fiscal-backend
          ref: 2c41fbab8169b7efca6bd2e80c963d57a50585b6
          path: backend-integration
          token: ${{ secrets.OPS_BACKEND_READ_TOKEN }}
          persist-credentials: false
      - name: One attempt per tree; first anomaly stops stage
        run: node docs/investigations/r7-sizing/run-stage.mjs
      - name: Preserve evidence including failures
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: f2-r7-sizing-02-18000
          path: f2-r7-sizing-18000/
          if-no-files-found: ignore
          retention-days: 7
  stage_45000:
    needs: stage_18000
    if: needs.stage_18000.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 14
    env:
      F2_VOLUME: '45000'
      F2_GRANT: F2-R7-SIZING-02
      F2_REVIEWED_HEAD: ${{ inputs.reviewed_head }}
      F2_REVIEW_COMMENT_ID: ${{ inputs.review_comment_id }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact reviewed control HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.22.2'
      - name: Verify coordinator PASS and single-use grant before backend preparation
        run: node --input-type=module -e "import {authorize} from './docs/investigations/r7-sizing/manual-gate-02.mjs'; await authorize();"
      - name: Checkout fixed control tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fabiojuniort-cyber/radar-fiscal-backend
          ref: b2150ab5ef34e9f9646e219d522e47738d9c04f5
          path: backend-control
          token: ${{ secrets.OPS_BACKEND_READ_TOKEN }}
          persist-credentials: false
      - name: Checkout fixed integration tree
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: fabiojuniort-cyber/radar-fiscal-backend
          ref: 2c41fbab8169b7efca6bd2e80c963d57a50585b6
          path: backend-integration
          token: ${{ secrets.OPS_BACKEND_READ_TOKEN }}
